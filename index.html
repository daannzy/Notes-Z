<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes-Z - Download</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .botao-download {
      display: inline-block;
      padding: 15px 30px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
      margin-top: 20px;
      transition: background 0.3s;
    }
    .botao-download:active {
      background-color: #0056b3;
      transform: scale(0.98);
    }
  </style>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 20px; background: #fdfdfd;">

  <img src="13108958.png" alt="Notes-Z Logo" width="200">
  
  <p><strong>Notes-Z</strong></p>
  
  <p style="max-width: 600px; margin: 0 auto;">
    Este projeto é um app simples que permite ao usuário digitar em um campo de texto multilinha e salvar o conteúdo automaticamente em um arquivo de texto no armazenamento interno do dispositivo.
  </p>

  <p>
    <a id="download-btn" href="#" class="botao-download">
    <i class="fas fa-download"></i> Baixar Versão Recente
</a>

<script>
  async function atualizarLinkDownload() {
    const repo = "daannzy/Notes-Z";
    const btn = document.getElementById('download-btn');
    
    try {
      // Busca a última release oficial no seu GitHub
      const response = await fetch(`https://api.github.com/repos/${repo}/releases/latest`);
      const data = await response.json();
      
      // Encontra o arquivo .apk dentro dessa release
      const apkAsset = data.assets.find(asset => asset.name.endsWith('.apk'));
      
      if (apkAsset) {
        btn.href = apkAsset.browser_download_url;
      }
    } catch (error) {
      // Caso a automação falhe, ele aponta para a página geral de releases
      btn.href = "https://github.com/daannzy/Notes-Z/releases/latest";
    }
  }
  atualizarLinkDownload();
</script>

  </p>

  <p>
    <a href="https://github.com/daannzy" target="_blank" style="color: #007bff; text-decoration: none;">Ver GitHub</a>
  </p>

  <footer style="margin-top: 50px; padding: 20px 0;">
    <div style="margin-bottom: 10px;">
      <a href="https://github.com/daannzy" target="_blank" style="color: #333; font-size: 28px; text-decoration: none;">
        <i class="fab fa-github"></i>
      </a>
    </div>
    <p style="margin: 0; font-size: 14px; color: #666;">&copy; 2025 daannzy</p>
  </footer>

</body>
</html>
