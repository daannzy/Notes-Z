<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes-Z - Download</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background: #fdfdfd;
    }

    .botao-download {
      display: inline-block;
      padding: 15px 30px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
      margin-top: 20px;
      cursor: pointer;
    }

    .botao-download:active {
      background-color: #0056b3;
    }
  </style>
</head>

<body>

  <img src="13108958.png" alt="Notes-Z Logo" width="200">

  <p style="max-width: 600px; margin: 20px auto;">
    <strong>Notes Z</strong> é um app simples e leve para anotar ideias,
    lembretes e textos do dia a dia.<br>
    Tudo o que você escreve é salvo automaticamente no seu celular.
  </p>

  <p>
    <a id="download-btn" href="#" class="botao-download">
      <i class="fas fa-download"></i> Baixar / atualizar o Notes Z
    </a>
  </p>

  <script>
    async function atualizarLinkDownload() {
      const repo = "daannzy/Notes-Z";
      const btn = document.getElementById("download-btn");

      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/releases/latest`);
        const data = await res.json();

        const apk = data.assets.find(a =>
          a.name.toLowerCase().endsWith(".apk")
        );

        if (!apk) throw "APK não encontrado";

        // 👇 VOLTAMOS PRO QUE FUNCIONA
        btn.href = apk.browser_download_url;
        btn.setAttribute("download", apk.name);

      } catch (e) {
        btn.href = "https://github.com/daannzy/Notes-Z/releases";
      }
    }

    atualizarLinkDownload();
  </script>

</body>
</html>
